# Local Postgres for the assignment. Port 5440 so it does not collide with a
# Postgres you already run on 5432.
services:
  db:
    image: postgres:15
    container_name: fleet-watch-pg
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleetwatch
    ports:
      - "5440:5432"
    volumes:
      - fleet-watch-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleetwatch"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  fleet-watch-pg-data:
